<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AURALIA — travel poster</title>
<style>
  html, body { margin: 0; padding: 0; background: #171233; }
  svg { display: block; }
</style>
</head>
<body>
<svg width="768" height="1024" viewBox="0 0 768 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2450"/>
      <stop offset="0.34" stop-color="#4a2f6d"/>
      <stop offset="0.58" stop-color="#9c4a72"/>
      <stop offset="0.78" stop-color="#e07f52"/>
      <stop offset="1" stop-color="#f6c177"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9a05f"/>
      <stop offset="0.12" stop-color="#7c5a78"/>
      <stop offset="0.4" stop-color="#2e5570"/>
      <stop offset="1" stop-color="#122c44"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8b06a"/>
      <stop offset="1" stop-color="#a96f3c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.46" r="0.85">
      <stop offset="0.72" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d0824" stop-opacity="0.42"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="768" height="1024" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#f7e8c9">
    <circle cx="90" cy="70" r="1.8" opacity="0.8"/><circle cx="180" cy="44" r="1.3" opacity="0.6"/>
    <circle cx="300" cy="86" r="1.5" opacity="0.7"/><circle cx="470" cy="52" r="1.8" opacity="0.8"/>
    <circle cx="590" cy="96" r="1.3" opacity="0.6"/><circle cx="680" cy="58" r="1.6" opacity="0.75"/>
    <circle cx="640" cy="150" r="1.2" opacity="0.5"/><circle cx="120" cy="150" r="1.2" opacity="0.5"/>
    <circle cx="240" cy="130" r="1.1" opacity="0.45"/><circle cx="530" cy="140" r="1.1" opacity="0.45"/>
  </g>

  <!-- place name -->
  <text x="384" y="148" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif"
        font-size="96" font-weight="bold" letter-spacing="16" fill="#f9edcb">AURALIA</text>
  <g stroke="#f2cf8f" stroke-width="2.5">
    <line x1="168" y1="182" x2="352" y2="182"/>
    <line x1="416" y1="182" x2="600" y2="182"/>
  </g>
  <rect x="376" y="174" width="16" height="16" transform="rotate(45 384 182)" fill="#f2cf8f"/>

  <!-- deco clouds -->
  <g fill="#f6c177" opacity="0.5">
    <rect x="60" y="238" width="190" height="13" rx="6.5"/>
    <rect x="96" y="262" width="120" height="10" rx="5"/>
    <rect x="520" y="222" width="170" height="13" rx="6.5"/>
    <rect x="556" y="246" width="104" height="10" rx="5"/>
  </g>
  <g fill="#2a1e3f" opacity="0.55">
    <rect x="150" y="300" width="150" height="11" rx="5.5"/>
    <rect x="470" y="316" width="140" height="11" rx="5.5"/>
  </g>

  <!-- sun and halo -->
  <circle cx="384" cy="600" r="215" fill="url(#glow)"/>
  <circle cx="384" cy="600" r="136" fill="none" stroke="#f9edcb" stroke-width="2" opacity="0.55"/>
  <circle cx="384" cy="600" r="118" fill="#fbe3a1"/>
  <circle cx="384" cy="600" r="118" fill="url(#glow)" opacity="0.35"/>

  <!-- sea -->
  <rect x="0" y="640" width="768" height="384" fill="url(#sea)"/>
  <line x1="0" y1="640" x2="768" y2="640" stroke="#ffd9a0" stroke-width="2" opacity="0.7"/>

  <!-- sun reflection -->
  <g fill="#fbe3a1">
    <rect x="330" y="668" width="108" height="5" rx="2.5" opacity="0.75"/>
    <rect x="342" y="692" width="84" height="5" rx="2.5" opacity="0.6"/>
    <rect x="322" y="716" width="124" height="6" rx="3" opacity="0.5"/>
    <rect x="348" y="742" width="72" height="5" rx="2.5" opacity="0.45"/>
    <rect x="336" y="768" width="96" height="6" rx="3" opacity="0.35"/>
    <rect x="356" y="796" width="56" height="5" rx="2.5" opacity="0.3"/>
    <rect x="344" y="824" width="80" height="5" rx="2.5" opacity="0.22"/>
  </g>
  <!-- wave lines -->
  <g stroke="#9fd4d8" stroke-width="2" opacity="0.35" fill="none">
    <path d="M230 706 q30 -8 60 0 t60 0"/>
    <path d="M560 720 q30 -8 60 0 t60 0"/>
    <path d="M70 800 q30 -8 60 0 t60 0"/>
    <path d="M540 830 q30 -8 60 0 t60 0"/>
    <path d="M120 900 q30 -8 60 0 t60 0"/>
    <path d="M480 930 q30 -8 60 0 t60 0"/>
  </g>

  <!-- cliffs -->
  <path d="M0 438 L148 484 L210 562 L198 648 L118 702 L0 736 Z" fill="#33204d"/>
  <path d="M768 424 L622 476 L560 556 L574 646 L652 700 L768 730 Z" fill="#2a1a42"/>
  <path d="M0 438 L148 484 L210 562 L196 576 L118 512 L0 492 Z" fill="#4a2c66" opacity="0.85"/>
  <path d="M768 424 L622 476 L560 556 L578 568 L650 506 L768 478 Z" fill="#40255c" opacity="0.85"/>

  <!-- the great arch bridge -->
  <path d="M198 592 Q384 430 570 584" fill="none" stroke="url(#stone)" stroke-width="46"/>
  <path d="M198 574 Q384 412 570 566" fill="none" stroke="#f4cd8d" stroke-width="4"/>
  <path d="M198 610 Q384 448 570 602" fill="none" stroke="#7c4f27" stroke-width="3" opacity="0.65"/>
  <!-- arch piers -->
  <rect x="222" y="566" width="26" height="92" fill="#8a5a30"/>
  <rect x="520" y="558" width="26" height="100" fill="#8a5a30"/>
  <!-- balustrade posts -->
  <g fill="#7c4f27">
    <rect x="287" y="484" width="7" height="22"/>
    <rect x="473" y="480" width="7" height="22"/>
  </g>

  <!-- bell tower on the arch -->
  <g>
    <rect x="356" y="392" width="56" height="96" fill="url(#stone)"/>
    <rect x="348" y="382" width="72" height="12" fill="#8a5a30"/>
    <path d="M348 382 L384 336 L420 382 Z" fill="#5b2a4a"/>
    <rect x="380" y="318" width="8" height="20" fill="#f2cf8f"/>
    <circle cx="384" cy="312" r="6" fill="#ffe9b0"/>
    <circle cx="384" cy="312" r="20" fill="url(#glow)"/>
    <!-- bell opening -->
    <path d="M368 448 v-26 a16 16 0 0 1 32 0 v26 Z" fill="#241536"/>
    <path d="M374 446 v-16 a10 12 0 0 1 20 0 v16 Z" fill="#f2b04a"/>
    <!-- tower windows -->
    <rect x="376" y="404" width="7" height="11" fill="#ffd9a0"/>
    <rect x="389" y="404" width="7" height="11" fill="#ffd9a0" opacity="0.75"/>
  </g>

  <!-- terraced houses, right headland -->
  <g>
    <rect x="646" y="494" width="46" height="34" fill="#e5c188"/>
    <path d="M642 494 L669 474 L696 494 Z" fill="#7c3550"/>
    <rect x="658" y="506" width="8" height="10" fill="#ffca7a"/>
    <rect x="674" y="506" width="8" height="10" fill="#ffca7a" opacity="0.8"/>
    <rect x="600" y="566" width="52" height="38" fill="#d9a05f"/>
    <path d="M596 566 L626 544 L656 566 Z" fill="#5b2a4a"/>
    <rect x="612" y="578" width="8" height="11" fill="#ffd9a0"/>
    <rect x="630" y="578" width="8" height="11" fill="#ffd9a0" opacity="0.7"/>
    <rect x="676" y="600" width="42" height="32" fill="#c98d4e"/>
    <path d="M672 600 L697 582 L722 600 Z" fill="#7c3550"/>
    <rect x="690" y="610" width="8" height="10" fill="#ffca7a"/>
  </g>
  <!-- houses, left headland -->
  <g>
    <rect x="52" y="488" width="42" height="30" fill="#e5c188"/>
    <path d="M48 488 L73 470 L98 488 Z" fill="#5b2a4a"/>
    <rect x="64" y="498" width="7" height="9" fill="#ffd9a0"/>
    <rect x="78" y="498" width="7" height="9" fill="#ffd9a0" opacity="0.7"/>
    <rect x="108" y="544" width="38" height="28" fill="#d9a05f"/>
    <path d="M104 544 L127 527 L150 544 Z" fill="#7c3550"/>
    <rect x="120" y="553" width="7" height="9" fill="#ffca7a"/>
  </g>

  <!-- cypress spires -->
  <g fill="#17352e">
    <path d="M584 646 q10 -52 20 0 q-10 8 -20 0 Z"/>
    <path d="M150 668 q9 -46 18 0 q-9 7 -18 0 Z"/>
    <path d="M706 668 q9 -44 18 0 q-9 7 -18 0 Z"/>
    <path d="M64 600 q8 -40 16 0 q-8 6 -16 0 Z"/>
  </g>

  <!-- birds -->
  <g stroke="#241536" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M120 356 q10 -10 20 0 q10 -10 20 0"/>
    <path d="M596 372 q9 -9 18 0 q9 -9 18 0"/>
    <path d="M300 268 q8 -8 16 0 q8 -8 16 0"/>
  </g>

  <!-- small boat -->
  <g>
    <path d="M120 858 l44 0 l-8 12 l-28 0 Z" fill="#241536"/>
    <rect x="140" y="828" width="3.5" height="30" fill="#241536"/>
    <path d="M144 830 l20 24 l-20 0 Z" fill="#f9edcb" opacity="0.9"/>
  </g>

  <!-- vignette + frame -->
  <rect x="0" y="0" width="768" height="1024" fill="url(#vignette)"/>
  <rect x="20" y="20" width="728" height="984" fill="none" stroke="#f2cf8f" stroke-width="3"/>
  <rect x="30" y="30" width="708" height="964" fill="none" stroke="#f2cf8f" stroke-width="1" opacity="0.7"/>
</svg>
</body>
</html>

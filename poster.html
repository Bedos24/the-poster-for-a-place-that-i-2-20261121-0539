<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AURALIA — a poster for a place that isn't there</title>
<style>
  html, body { margin: 0; padding: 0; background: #171233; }
  svg { display: block; }
</style>
</head>
<body>
<svg width="768" height="1024" viewBox="0 0 768 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#1b2450"/>
      <stop offset="0.34" stop-color="#4a2f6d"/>
      <stop offset="0.58" stop-color="#9c4a72"/>
      <stop offset="0.78" stop-color="#e07f52"/>
      <stop offset="1"    stop-color="#f6c177"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#e9a05f"/>
      <stop offset="0.12" stop-color="#7c5a78"/>
      <stop offset="0.4"  stop-color="#2e5570"/>
      <stop offset="1"    stop-color="#122c44"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8b06a"/>
      <stop offset="1" stop-color="#a96f3c"/>
    </linearGradient>
    <radialGradient id="sunhalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#ffe9b0" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#ffe9b0" stop-opacity="0.35"/>
      <stop offset="1"    stop-color="#ffe9b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orblight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="0.5" cy="0.46" r="0.75">
      <stop offset="0"    stop-color="#0d0824" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#0d0824" stop-opacity="0"/>
      <stop offset="1"    stop-color="#0d0824" stop-opacity="0.42"/>
    </radialGradient>
    <!-- the sun may sink to the horizon line, never below it -->
    <clipPath id="skyonly"><rect x="0" y="0" width="768" height="640"/></clipPath>
    <!-- one cypress flame, reused at several spots -->
    <path id="cypress" d="M0 0 C 11 -26 13 -54 0 -88 C -13 -54 -11 -26 0 0 Z"/>
    <!-- one gull, reused -->
    <path id="gull" d="M0 0 Q 7 -7 14 0 Q 21 -7 28 0" fill="none" stroke="#241536" stroke-width="2.4" stroke-linecap="round"/>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="768" height="1024" fill="#171233"/>
  <rect x="0" y="0" width="768" height="640" fill="url(#sky)"/>
  <rect x="0" y="640" width="768" height="384" fill="url(#sea)"/>

  <!-- starfield, upper sky only -->
  <g fill="#f7e8c9">
    <circle cx="58"  cy="66"  r="2.2"/>
    <circle cx="138" cy="38"  r="1.6"/>
    <circle cx="226" cy="84"  r="2.5"/>
    <circle cx="318" cy="44"  r="1.5"/>
    <circle cx="452" cy="58"  r="2.1"/>
    <circle cx="540" cy="34"  r="1.6"/>
    <circle cx="618" cy="88"  r="2.4"/>
    <circle cx="700" cy="52"  r="1.8"/>
    <circle cx="96"  cy="150" r="1.5"/>
    <circle cx="668" cy="158" r="1.5"/>
    <circle cx="384" cy="92"  r="1.4"/>
    <circle cx="262" cy="128" r="1.3"/>
  </g>

  <!-- deco cloud bars: gilt above, dusk below -->
  <g>
    <rect x="52"  y="216" width="128" height="13" rx="6.5" fill="#f6c177" opacity="0.5"/>
    <rect x="84"  y="240" width="82"  height="11" rx="5.5" fill="#f6c177" opacity="0.42"/>
    <rect x="66"  y="262" width="104" height="12" rx="6"   fill="#2a1e3f" opacity="0.55"/>
    <rect x="588" y="206" width="122" height="13" rx="6.5" fill="#f6c177" opacity="0.5"/>
    <rect x="616" y="230" width="76"  height="11" rx="5.5" fill="#f6c177" opacity="0.42"/>
    <rect x="600" y="252" width="98"  height="12" rx="6"   fill="#2a1e3f" opacity="0.55"/>
  </g>

  <!-- the name, set into the sky -->
  <text x="384" y="148" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-weight="bold"
        font-size="96" letter-spacing="16" fill="#f9edcb">AURALIA</text>
  <g stroke="#f2cf8f" stroke-width="2.5">
    <line x1="168" y1="182" x2="352" y2="182"/>
    <line x1="416" y1="182" x2="600" y2="182"/>
  </g>
  <rect x="376" y="174" width="16" height="16" fill="#f2cf8f" transform="rotate(45 384 182)"/>

  <!-- sun, half-sunk on the horizon line -->
  <g clip-path="url(#skyonly)">
    <circle cx="384" cy="600" r="215" fill="url(#sunhalo)"/>
    <circle cx="384" cy="600" r="136" fill="none" stroke="#f9edcb" stroke-width="2" opacity="0.55"/>
    <circle cx="384" cy="600" r="118" fill="#fbe3a1" opacity="0.96"/>
  </g>

  <!-- headlands -->
  <path d="M0 442 L142 480 L214 560 L202 650 L116 706 L0 740 Z" fill="#33204d"/>
  <path d="M0 442 L142 480 L214 560" fill="none" stroke="#4a2c66" stroke-width="5" opacity="0.85"/>
  <path d="M768 442 L626 480 L554 560 L566 650 L652 706 L768 740 Z" fill="#2a1a42"/>
  <path d="M768 442 L626 480 L554 560" fill="none" stroke="#40255c" stroke-width="5" opacity="0.85"/>

  <!-- sun-road on the water -->
  <g fill="#fbe3a1">
    <rect x="325" y="664" width="118" height="9" rx="4.5" opacity="0.80"/>
    <rect x="332" y="692" width="104" height="9" rx="4.5" opacity="0.72"/>
    <rect x="328" y="720" width="112" height="9" rx="4.5" opacity="0.64"/>
    <rect x="338" y="748" width="92"  height="9" rx="4.5" opacity="0.56"/>
    <rect x="334" y="774" width="100" height="9" rx="4.5" opacity="0.47"/>
    <rect x="342" y="800" width="84"  height="9" rx="4.5" opacity="0.39"/>
    <rect x="339" y="826" width="90"  height="9" rx="4.5" opacity="0.30"/>
    <rect x="346" y="852" width="76"  height="9" rx="4.5" opacity="0.22"/>
  </g>
  <g fill="none" stroke="#9fd4d8" stroke-width="2" opacity="0.35" stroke-linecap="round">
    <path d="M120 700 q 14 -7 28 0 t 28 0"/>
    <path d="M560 736 q 14 -7 28 0 t 28 0"/>
    <path d="M180 806 q 14 -7 28 0 t 28 0"/>
    <path d="M520 858 q 14 -7 28 0 t 28 0"/>
    <path d="M96 884 q 14 -7 28 0 t 28 0"/>
    <path d="M600 930 q 14 -7 28 0 t 28 0"/>
  </g>
  <line x1="0" y1="640" x2="768" y2="640" stroke="#ffd9a0" stroke-width="2" opacity="0.7"/>

  <!-- the great arch: piers, span, trims, balustrade -->
  <rect x="222" y="566" width="26" height="92"  fill="#8a5a30"/>
  <rect x="520" y="558" width="26" height="100" fill="#8a5a30"/>
  <path d="M198 592 Q384 430 570 584" fill="none" stroke="url(#stone)" stroke-width="46"/>
  <path d="M198 592 Q384 430 570 584" fill="none" stroke="#7c4f27" stroke-width="3" opacity="0.65" transform="translate(0 20)"/>
  <path d="M198 592 Q384 430 570 584" fill="none" stroke="#f4cd8d" stroke-width="4" opacity="0.85" transform="translate(0 -21)"/>
  <g fill="#7c4f27">
    <rect x="243" y="512" width="5" height="15"/>
    <rect x="300" y="482" width="5" height="15"/>
    <rect x="381" y="472" width="5" height="15"/>
    <rect x="462" y="482" width="5" height="15"/>
    <rect x="519" y="512" width="5" height="15"/>
  </g>

  <!-- bell tower riding the arch -->
  <g>
    <rect x="356" y="392" width="56" height="96" fill="url(#stone)"/>
    <rect x="348" y="382" width="72" height="12" fill="#8a5a30"/>
    <path d="M348 382 L384 336 L420 382 Z" fill="#5b2a4a"/>
    <rect x="382" y="318" width="4" height="20" fill="#8a5a30"/>
    <circle cx="384" cy="312" r="20" fill="url(#orblight)"/>
    <circle cx="384" cy="312" r="6"  fill="#ffe9b0"/>
    <path d="M368 428 a16 16 0 0 1 32 0 l0 22 l-32 0 Z" fill="#241536"/>
    <circle cx="384" cy="436" r="7" fill="#f2b04a"/>
    <rect x="366" y="458" width="9" height="13" fill="#ffd9a0"/>
    <rect x="393" y="458" width="9" height="13" fill="#ffd9a0"/>
  </g>

  <!-- terraced houses, lamps lit -->
  <g>
    <!-- right headland -->
    <rect x="646" y="494" width="46" height="34" fill="#e5c188"/>
    <path d="M642 494 L669 476 L696 494 Z" fill="#7c3550"/>
    <rect x="660" y="506" width="8" height="10" fill="#ffca7a"/>
    <rect x="676" y="506" width="8" height="10" fill="#ffd9a0"/>
    <rect x="600" y="566" width="52" height="38" fill="#d9a05f"/>
    <path d="M596 566 L626 546 L656 566 Z" fill="#5b2a4a"/>
    <rect x="612" y="578" width="9" height="11" fill="#ffd9a0"/>
    <rect x="630" y="578" width="9" height="11" fill="#ffca7a"/>
    <rect x="676" y="600" width="42" height="32" fill="#c98d4e"/>
    <path d="M672 600 L697 584 L722 600 Z" fill="#7c3550"/>
    <rect x="690" y="610" width="8" height="10" fill="#ffca7a"/>
    <!-- left headland -->
    <rect x="52" y="488" width="42" height="30" fill="#d9a05f"/>
    <path d="M48 488 L73 472 L98 488 Z" fill="#5b2a4a"/>
    <rect x="64" y="498" width="8" height="10" fill="#ffd9a0"/>
    <rect x="108" y="544" width="38" height="28" fill="#e5c188"/>
    <path d="M104 544 L127 530 L150 544 Z" fill="#7c3550"/>
    <rect x="120" y="553" width="8" height="9" fill="#ffca7a"/>
  </g>

  <!-- cypress spires -->
  <g fill="#17352e">
    <use href="#cypress" transform="translate(584 560) scale(0.9)"/>
    <use href="#cypress" transform="translate(150 540) scale(0.8)"/>
    <use href="#cypress" transform="translate(706 668) scale(1.0)"/>
    <use href="#cypress" transform="translate(64 640) scale(0.85)"/>
  </g>

  <!-- gulls -->
  <use href="#gull" transform="translate(238 268)"/>
  <use href="#gull" transform="translate(492 240) scale(0.8)"/>
  <use href="#gull" transform="translate(548 300) scale(1.15)"/>

  <!-- a small boat coming home -->
  <g transform="translate(120 858)">
    <path d="M-26 18 L26 18 L17 30 L-17 30 Z" fill="#241536"/>
    <rect x="-1.5" y="-24" width="3" height="42" fill="#241536"/>
    <path d="M3 -24 L3 14 L24 14 Z" fill="#f9edcb" opacity="0.9"/>
    <path d="M-3 -18 L-3 14 L-19 14 Z" fill="#f9edcb" opacity="0.65"/>
  </g>

  <!-- vignette and the double gilt frame go on last -->
  <rect x="0" y="0" width="768" height="1024" fill="url(#shade)"/>
  <rect x="20" y="20" width="728" height="984" fill="none" stroke="#f2cf8f" stroke-width="3"/>
  <rect x="30" y="30" width="708" height="964" fill="none" stroke="#f2cf8f" stroke-width="1" opacity="0.7"/>
</svg>
</body>
</html>
